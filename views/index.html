    <script>
        var term = new Terminal({
            cols: 120,
            rows: 38
        });
        term.open(document.getElementById("terminal"));
        term.writeln("Running startup command: python3 run.py");
        term.writeln("");

        // Focus the terminal without letting the browser scroll the page to the cursor
        function focusTerm() {
            if (term.textarea) { term.textarea.focus({ preventScroll: true }); }
        }

        var ws = new WebSocket(location.protocol.replace("http", "ws") + "//" + location.hostname + (location.port ? (
            ":" + location.port) : "") + "/");

        ws.onopen = function () {
            term.loadAddon(new AttachAddon.AttachAddon(ws));
            // Set focus in the terminal
            focusTerm();
        };

        ws.onerror = function (e) {
            console.log(e);
        };

        // Make the terminal a window that can be moved around (mouse, touch or arrow keys)
        (function () {
            var win = document.getElementById("term-window");
            var bar = document.getElementById("term-titlebar");
            var x = 0, y = 0, startX = 0, startY = 0, baseX = 0, baseY = 0, dragging = false;
            var headerHeight = 64, keep = 80;

            function place() {
                win.style.transform = "translate(" + x + "px," + y + "px)";
                var r = win.getBoundingClientRect();
                // keep the title bar reachable: never fully off screen, never under the header
                if (r.top < headerHeight) { y += headerHeight - r.top; }
                if (r.top > window.innerHeight - 48) { y -= r.top - (window.innerHeight - 48); }
                if (r.right < keep) { x += keep - r.right; }
                if (r.left > window.innerWidth - keep) { x -= r.left - (window.innerWidth - keep); }
                win.style.transform = "translate(" + x + "px," + y + "px)";
            }

            bar.addEventListener("pointerdown", function (e) {
                if (e.target.closest("button")) { return; }
                dragging = true;
                startX = e.clientX; startY = e.clientY; baseX = x; baseY = y;
                bar.setPointerCapture(e.pointerId);
                win.classList.add("dragging");
            });
            bar.addEventListener("pointermove", function (e) {
                if (!dragging) { return; }
                x = baseX + (e.clientX - startX);
                y = baseY + (e.clientY - startY);
                place();
            });
            function stop(e) {
                if (!dragging) { return; }
                dragging = false;
                win.classList.remove("dragging");
                if (bar.hasPointerCapture(e.pointerId)) { bar.releasePointerCapture(e.pointerId); }
                focusTerm();
            }
            bar.addEventListener("pointerup", stop);
            bar.addEventListener("pointercancel", stop);
            bar.addEventListener("keydown", function (e) {
                var step = e.shiftKey ? 80 : 20;
                if (e.key === "ArrowLeft") { x -= step; }
                else if (e.key === "ArrowRight") { x += step; }
                else if (e.key === "ArrowUp") { y -= step; }
                else if (e.key === "ArrowDown") { y += step; }
                else if (e.key === "Home") { x = 0; y = 0; }
                else { return; }
                e.preventDefault();
                place();
            });
            bar.addEventListener("dblclick", function (e) {
                if (e.target.closest("button")) { return; }
                x = 0; y = 0; place();
            });
            win.addEventListener("click", function (e) { if (!e.target.closest("button")) { focusTerm(); } });
            window.addEventListener("resize", function () { fitToScreen(); place(); });

            // Resizing scales the text, so the game's fixed 120 x 38 layout never wraps or breaks
            var grip = document.getElementById("term-grip");
            var minFont = 9, maxFont = 28;

            function setFont(size) {
                size = Math.max(minFont, Math.min(maxFont, Math.round(size * 2) / 2));
                term.options.fontSize = size;
                grip.setAttribute("aria-valuenow", String(size));
            }

            // Never wider than the screen: shrink the text until the whole window fits
            function fitToScreen() {
                var limit = window.innerWidth - 32;
                while (term.options.fontSize > minFont && win.getBoundingClientRect().width > limit) {
                    setFont(term.options.fontSize - 0.5);
                }
            }

            var resizing = false, gx = 0, gy = 0, gw = 0, gh = 0, gfont = 0, gleft = 0;
            grip.addEventListener("pointerdown", function (e) {
                resizing = true;
                var r = win.getBoundingClientRect();
                gx = e.clientX; gy = e.clientY; gw = r.width; gh = r.height; gleft = r.left; gfont = term.options.fontSize;
                grip.setPointerCapture(e.pointerId);
                win.classList.add("dragging");
                e.preventDefault();
            });
            grip.addEventListener("pointermove", function (e) {
                if (!resizing) { return; }
                var scale = ((gw + (e.clientX - gx)) / gw + (gh + (e.clientY - gy)) / gh) / 2;
                setFont(gfont * scale);
                fitToScreen();
                // keep the top-left corner where it was, so the handle follows the pointer
                x += gleft - win.getBoundingClientRect().left;
                place();
            });
            function stopResize(e) {
                if (!resizing) { return; }
                resizing = false;
                win.classList.remove("dragging");
                if (grip.hasPointerCapture(e.pointerId)) { grip.releasePointerCapture(e.pointerId); }
                focusTerm();
            }
            grip.addEventListener("pointerup", stopResize);
            grip.addEventListener("pointercancel", stopResize);
            grip.addEventListener("keydown", function (e) {
                if (e.key === "ArrowRight" || e.key === "ArrowUp") { setFont(term.options.fontSize + 1); }
                else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { setFont(term.options.fontSize - 1); }
                else { return; }
                e.preventDefault();
                fitToScreen();
                place();
            });

            fitToScreen();
            place();
        })();
    </script>
